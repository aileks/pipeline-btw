target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = [
    "build",
    "dist",
    "generated",
    "**/generated/**",
    "**/_generated/**",
]

[lint]
ignore = ["E501"]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "LOG",
    "G",
    "PERF",
    "RUF",
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/*.ipynb" = ["E402"]

[lint.isort]
combine-as-imports = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
